<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 212 78" role="img" aria-label="One electrical cycle P_e spans two alternating poles N and S; the pole pitch τp is half of it">
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <!-- P_e spans one full electrical cycle: two alternating poles -->
    <g stroke="#34d399" stroke-width="1">
      <line x1="20" y1="6" x2="20" y2="22"/>
      <line x1="108" y1="6" x2="108" y2="22"/>
      <line x1="20" y1="14" x2="50" y2="14"/>
      <line x1="78" y1="14" x2="108" y2="14"/>
    </g>
    <text x="64" y="14" text-anchor="middle" dominant-baseline="central" fill="#34d399" font-size="10" font-style="italic">P<tspan font-size="7" dy="2">e</tspan></text>

    <!-- τp spans one pole: half of the cycle -->
    <g stroke="#7dd3fc" stroke-width="1">
      <line x1="20" y1="26" x2="20" y2="42"/>
      <line x1="64" y1="26" x2="64" y2="42"/>
      <line x1="20" y1="34" x2="36" y2="34"/>
      <line x1="48" y1="34" x2="64" y2="34"/>
    </g>
    <text x="42" y="34" text-anchor="middle" dominant-baseline="central" fill="#7dd3fc" font-size="10" font-style="italic">τ<tspan font-size="7" dy="2">p</tspan></text>

    <!-- Alternating stator poles -->
    <g stroke="#0f172a" stroke-width="1">
      <rect x="20" y="48" width="44" height="22" fill="#334155"/>
      <rect x="64" y="48" width="44" height="22" fill="#94a3b8"/>
      <rect x="108" y="48" width="44" height="22" fill="#334155"/>
      <rect x="152" y="48" width="44" height="22" fill="#94a3b8"/>
    </g>
    <g text-anchor="middle" font-size="10" font-weight="600">
      <text x="42" y="62" fill="#cbd5e1">N</text>
      <text x="86" y="62" fill="#0f172a">S</text>
      <text x="130" y="62" fill="#cbd5e1">N</text>
      <text x="174" y="62" fill="#0f172a">S</text>
    </g>
  </g>
</svg>
